name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backup_acceptance:
        description: Run the pinned restic 0.19.1 Linux composition lane
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Public check plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.check-plan.outputs.base_sha }}
      browser: ${{ steps.check-plan.outputs.browser }}
      check_plan: ${{ steps.check-plan.outputs.check_plan }}
      fail_closed: ${{ steps.check-plan.outputs.fail_closed }}
      head_sha: ${{ steps.check-plan.outputs.head_sha }}
      mode: ${{ steps.check-plan.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Plan affected public checks
        id: check-plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node tooling/check-affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --dry-run
          node tooling/check-affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --dry-run --format github >> "$GITHUB_OUTPUT"

  verify_pr:
    name: Public foundation checks
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24.20.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.27.0

      - name: Install public dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        if: needs.plan.outputs.browser == 'true'
        run: pnpm --filter @vegastack/labs-web exec playwright install --with-deps chromium

      - name: Run affected public checks
        env:
          VSK_CHECK_PLAN_B64: ${{ needs.plan.outputs.check_plan }}
        run: pnpm check:affected --execute-plan

      - name: Verify generated contracts and embedded Console stay unchanged
        run: git diff --exit-code

  verify_trusted:
    name: Public foundation checks
    needs: plan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Allow only the disposable Debian hosts
        run: |
          case "$(hostname)" in
            vsk-node-01|vsk-node-06) ;;
            *) echo "Refusing unapproved self-hosted runner" >&2; exit 1 ;;
          esac

      - name: Prepare protected local test storage
        run: |
          umask 077
          TMPDIR="$(mktemp -d -p /var/tmp vsk.XXXXXX)"
          cleanup_unexported_temp() {
            case "$TMPDIR" in
              /var/tmp/vsk.??????) rm -rf -- "$TMPDIR" ;;
              *) echo "Refusing unexpected cleanup path" >&2 ;;
            esac
          }
          trap cleanup_unexported_temp EXIT
          test "$(stat -c '%a:%u' "$TMPDIR")" = "700:$(id -u)"
          case "$(stat -f -c '%T' "$TMPDIR")" in
            ext2/ext3|xfs|btrfs|f2fs|zfs) ;;
            *) echo "Refusing unsupported test filesystem" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.27.0

      - name: Install public dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        if: needs.plan.outputs.browser == 'true' || github.event_name == 'push'
        run: pnpm --filter @vegastack/labs-web exec playwright install --with-deps chromium

      - name: Run affected public checks
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          VSK_CHECK_PLAN_B64: ${{ needs.plan.outputs.check_plan }}
        run: pnpm check:affected --execute-plan

      - name: Run pinned local-backup acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.backup_acceptance
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) archive_sha=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c; binary_sha=20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639; suffix=amd64 ;;
            aarch64) archive_sha=a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465; binary_sha=2fb45ac6f9071b6f20eb883953a188f9e7c7cb6bbe43c67a2e47ada4e85ee7f0; suffix=arm64 ;;
            *) echo 'Unsupported restic acceptance architecture' >&2; exit 1 ;;
          esac
          mkdir -m 700 "$TMPDIR/restic-acceptance"
          curl --fail --location --silent --show-error \
            "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_${suffix}.bz2" \
            --output "$TMPDIR/restic-acceptance/restic.bz2"
          printf '%s  %s\n' "$archive_sha" "$TMPDIR/restic-acceptance/restic.bz2" | sha256sum --check --status
          bzip2 -dc "$TMPDIR/restic-acceptance/restic.bz2" > "$TMPDIR/restic-acceptance/restic"
          chmod 700 "$TMPDIR/restic-acceptance/restic"
          printf '%s  %s\n' "$binary_sha" "$TMPDIR/restic-acceptance/restic" | sha256sum --check --status
          VSK_RESTIC_0191_BINARY="$TMPDIR/restic-acceptance/restic" \
            go test ./internal/backup ./internal/adapter/localbackup -run 'TestPinnedResticEndToEnd|TestLocalBackupComposition' -count=1 -timeout 45s -v

      - name: Run exact Phase 4 exit acceptance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --silent check:phase-4-exit --commit "$GITHUB_SHA"

      - name: Verify generated contracts and embedded Console stay unchanged
        run: git diff --exit-code

      - name: Remove protected local test storage
        if: always()
        run: |
          case "$TMPDIR" in
            /var/tmp/vsk.??????) ;;
            *) echo "Refusing unexpected cleanup path" >&2; exit 1 ;;
          esac
          rm -rf -- "$TMPDIR"
