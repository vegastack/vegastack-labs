name: Public CI

on:
  workflow_dispatch:
    inputs:
      full_check:
        description: 'Run the complete lane for the final Phase 5 integration or acceptance candidate'
        required: false
        default: false
        type: boolean
      native_credential_sha:
        description: 'Exact #143 branch SHA for disposable native credential acceptance; leave empty for ordinary checks'
        required: false
        type: string
      backup_acceptance:
        description: Run the pinned restic 0.19.1 Linux composition lane
        required: false
        default: false
        type: boolean


permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Public check plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.check-plan.outputs.base_sha }}
      browser: ${{ steps.check-plan.outputs.browser }}
      check_plan: ${{ steps.check-plan.outputs.check_plan }}
      fail_closed: ${{ steps.check-plan.outputs.fail_closed }}
      head_sha: ${{ steps.check-plan.outputs.head_sha }}
      mode: ${{ steps.check-plan.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Plan affected public checks
        id: check-plan
        env:
          FULL_CHECK: ${{ inputs.full_check || false }}
          HEAD_SHA: ${{ github.sha }}
          NATIVE_CREDENTIAL_SHA: ${{ inputs.native_credential_sha || '' }}
          BACKUP_ACCEPTANCE: ${{ inputs.backup_acceptance || false }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$FULL_CHECK" != true ] && [ -z "$NATIVE_CREDENTIAL_SHA" ] && [ "$BACKUP_ACCEPTANCE" != true ]; then
            echo "dispatch must explicitly select final full_check or a named native acceptance lane" >&2
            exit 1
          fi
          if [ -n "$NATIVE_CREDENTIAL_SHA" ]; then
            [[ "$NATIVE_CREDENTIAL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "native credential acceptance requires an exact SHA" >&2; exit 1; }
            test "$NATIVE_CREDENTIAL_SHA" = "$HEAD_SHA" || { echo "native credential acceptance SHA must equal the dispatch head" >&2; exit 1; }
            test "$REF_NAME" = refs/heads/feat/143-native-credential-authority || { echo "native credential acceptance requires its reviewed branch" >&2; exit 1; }
          fi
          node tooling/check-affected.mjs --base "" --head "$HEAD_SHA" --dry-run
          node tooling/check-affected.mjs --base "" --head "$HEAD_SHA" --dry-run --format github >> "$GITHUB_OUTPUT"

  verify_trusted:
    name: Public foundation checks
    needs: plan
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Allow only the disposable Debian hosts
        run: |
          case "$(hostname)" in
            vsk-node-01|vsk-node-06) ;;
            *) echo "Refusing unapproved self-hosted runner" >&2; exit 1 ;;
          esac

      - name: Prepare protected local test storage
        run: |
          umask 077
          TMPDIR="$(mktemp -d -p /var/tmp vsk.XXXXXX)"
          cleanup_unexported_temp() {
            case "$TMPDIR" in
              /var/tmp/vsk.??????) rm -rf -- "$TMPDIR" ;;
              *) echo "Refusing unexpected cleanup path" >&2 ;;
            esac
          }
          trap cleanup_unexported_temp EXIT
          test "$(stat -c '%a:%u' "$TMPDIR")" = "700:$(id -u)"
          case "$(stat -f -c '%T' "$TMPDIR")" in
            ext2/ext3|xfs|btrfs|f2fs|zfs) ;;
            *) echo "Refusing unsupported test filesystem" >&2; exit 1 ;;
          esac
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.27.0

      - name: 'Run exact #143 disposable native credential acceptance'
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/143-native-credential-authority' && inputs.native_credential_sha != ''
        env:
          VSK143_SHA: ${{ inputs.native_credential_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$VSK143_SHA"
          test "$(git rev-parse HEAD)" = "$VSK143_SHA"
          test -z "$(git status --porcelain)"
          case "$(hostname)" in vsk-node-01|vsk-node-06) ;; *) exit 1 ;; esac
          sudo -n true
          go build -o "$RUNNER_TEMP/vsk143-binary" ./cmd/vsk-labs
          sudo -n env VSK_NATIVE_AUTHORITY_DISPOSABLE=1 VSK143_RUN_ID="$GITHUB_RUN_ID" VSK143_SHA="$VSK143_SHA" VSK143_WORKSPACE="$GITHUB_WORKSPACE" VSK143_BINARY="$RUNNER_TEMP/vsk143-binary" bash tooling/native-credential-authority-ci-fixture.sh

      - name: Install public dependencies
        if: inputs.full_check
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        if: inputs.full_check
        run: pnpm --filter @vegastack/labs-web exec playwright install --with-deps chromium

      - name: Run affected public checks
        if: inputs.full_check && github.ref != 'refs/heads/main'
        env:
          VSK_CHECK_PLAN_B64: ${{ needs.plan.outputs.check_plan }}
        run: |
          git show 807fc6f027ca0a0a7c96230f5adddd20d756080a:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm --filter @vegastack/labs-web build
          VSK_PHASE3_PLAYWRIGHT_OUTPUT="$TMPDIR/phase3-recovery-acceptance" pnpm --filter @vegastack/labs-web exec playwright test e2e/phase5-acceptance.spec.ts --grep 'Phase 5 acceptance keeps protected recovery authority out of the browser' --reporter=line
          VSK_PHASE3_PLAYWRIGHT_OUTPUT="$TMPDIR/phase3-recovery-workflow" pnpm --filter @vegastack/labs-web exec playwright test e2e/phase5-workflows.spec.ts --grep 'Phase 5 recovery-required and audit incident states disable ordinary mutations' --reporter=line

      - name: Run pinned local-backup acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.backup_acceptance
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) archive_sha=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c; binary_sha=20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639; suffix=amd64 ;;
            aarch64) archive_sha=a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465; binary_sha=2fb45ac6f9071b6f20eb883953a188f9e7c7cb6bbe43c67a2e47ada4e85ee7f0; suffix=arm64 ;;
            *) echo 'Unsupported restic acceptance architecture' >&2; exit 1 ;;
          esac
          mkdir -m 700 "$TMPDIR/restic-acceptance"
          curl --fail --location --silent --show-error \
            "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_${suffix}.bz2" \
            --output "$TMPDIR/restic-acceptance/restic.bz2"
          printf '%s  %s\n' "$archive_sha" "$TMPDIR/restic-acceptance/restic.bz2" | sha256sum --check --status
          bzip2 -dc "$TMPDIR/restic-acceptance/restic.bz2" > "$TMPDIR/restic-acceptance/restic"
          chmod 700 "$TMPDIR/restic-acceptance/restic"
          printf '%s  %s\n' "$binary_sha" "$TMPDIR/restic-acceptance/restic" | sha256sum --check --status
          VSK_RESTIC_0191_BINARY="$TMPDIR/restic-acceptance/restic" \
            go test ./internal/backup ./internal/adapter/localbackup -run 'TestPinnedResticEndToEnd|TestPinnedResticRejectsAuthenticatedV1Repository|TestPinnedResticOffsiteS3IAM|TestLocalBackupComposition' -count=1 -timeout 45s -v

      - name: Run exact Phase 5 exit acceptance
        if: inputs.full_check && github.ref == 'refs/heads/main'
        run: pnpm --silent check:phase-5-exit --commit "$GITHUB_SHA"

      - name: Remove protected local test storage
        if: always()
        run: |
          case "$TMPDIR" in
            /var/tmp/vsk.??????) ;;
            *) echo "Refusing unexpected cleanup path" >&2; exit 1 ;;
          esac
          rm -rf -- "$TMPDIR"

      - name: 'Remove exact #143 disposable native credential fixture'
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/143-native-credential-authority' && inputs.native_credential_sha != ''
        env:
          VSK143_SHA: ${{ inputs.native_credential_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$VSK143_SHA"
          sudo -n env VSK143_RUN_ID="$GITHUB_RUN_ID" VSK143_SHA="$VSK143_SHA" bash tooling/native-credential-authority-ci-fixture.sh --cleanup
